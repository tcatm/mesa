# Everything on the Mesa server, deployed from this repo. The server pulls
# main every minute and applies changes (deploy/pull.sh, deploy/apply.sh).
# Secrets come from deploy/secrets.env.age, decrypted on the server only.
name: mesa
services:
  elysium:
    image: offchainlabs/nitro-node:v3.12.2-5f02f3f
    restart: unless-stopped
    ports:
      - "127.0.0.1:8547:8547"
      - "127.0.0.1:8548:8548"
    volumes:
      - /opt/mesa/data/elysium:/home/user/.arbitrum
      - ../node/chaininfo-mainnet.json:/config/chaininfo.json:ro
    command:
      - --conf.file=/config/chaininfo.json
      - --parent-chain.connection.url=${PARENT_RPC}
      - --node.inbox-reader.max-blocks-to-read=10000
      - --node.dangerous.disable-blob-reader
      - --node.data-availability.enable
      - --node.data-availability.rest-aggregator.enable
      - --node.data-availability.rest-aggregator.urls=https://das-elysium-mainnet.t.conduit.xyz
      - --node.feed.input.url=wss://relay-elysium-mainnet.t.conduit.xyz/
      - --node.staker.enable=false
      - --execution.forwarding-target=null
      - --http.addr=0.0.0.0
      - --http.port=8547
      - --http.api=net,web3,eth,arb
      - --http.vhosts=*
      - --http.corsdomain=*
      - --ws.addr=0.0.0.0
      - --ws.port=8548
      - --ws.api=net,web3,eth
      - --ws.origins=*

  relay:
    build: ../relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:8545:8545"
    environment:
      NETWORK: mainnet
      MODE: inbox
      UPSTREAM_RPC: http://elysium:8547
      PARENT_RPC: ${PARENT_RPC}
      RELAYER_KEY: ${RELAYER_KEY}
      # Withdrawals (ArbSys, MesaWithdraw), the $MESA BuybackBurner (for its
      # keeper) and trading: the Universal Routers of
      # the official and ElysPump PoolManagers. Permit2 approvals and plain HYPE
      # transfers to wallets are allowed by the relay itself.
      ALLOW_TO: "0x0000000000000000000000000000000000000064,0xe1d51502D5bc0d67f48df64A589e89663D0Ce59B,0xcCFe02C0a8Fec0c39683aE00b35A5d4560d8E7C1,0x1b341fdd55d56f8e08409a2c25ddfad93eb03c1a,0x751cefb96ac88db5327d39e0fbdd5d882d80b430"
      # Mesa launch v1: the hook, and every token it launches.
      MESA_HOOK: "0xE928F2336051cBD5B9D4531C25EaDd13f9A82aeC"
      # Launch-day headroom: the relayer pays about 0.00016 HYPE per relayed
      # transaction on HyperEVM, so 1,500 an hour stays under 0.5 HYPE.
      MAX_HYPE_PER_HOUR: "0.5"
      MAX_RELAYS_PER_HOUR: "1500"
      # Wallets and pages poll hard; 600 reads a minute per IP was too low.
      READ_PER_IP_PER_MIN: "2400"
      PORT: "8545"

  # $MESA's buyback keeper: spends the BuybackBurner's HYPE on $MESA in small
  # chunks and burns it (relay/src/keeper.ts). Sends through the relay.
  keeper:
    build: ../relay
    restart: unless-stopped
    command: ["node", "dist/keeper.js"]
    environment:
      KEEPER_KEY: ${KEEPER_KEY}
      RPC: http://relay:8545
      READ_RPC: http://elysium:8547
    depends_on:
      - relay

  indexer:
    build: ../indexer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NETWORK: testnet
      RPC: ${ELYSIUM_TESTNET_RPC}
      DB: /data/terminal-testnet.db
      PORT: "8080"
    volumes:
      - /opt/mesa/data/indexer:/data

  # The terminal on Elysium mainnet: every launchpad's pools, read straight
  # from our own node. Served at api.mesa.cx/elysium/.
  terminal:
    build: ../indexer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      NETWORK: mainnet
      RPC: http://elysium:8547
      PARENT_RPC: ${PARENT_RPC}
      DB: /data/terminal-mainnet.db
      PORT: "8081"
      # Largest block range per request; busy stretches shrink it by event count.
      RANGE: "50000"
    volumes:
      - /opt/mesa/data/indexer:/data

  status:
    build: ../status
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      PARENT_RPC: ${PARENT_RPC}
      LIVE_RPC: https://rpc.agoradex.app
      INDEXER_URL: http://terminal:8081
      INDEXER_NETWORK: mainnet
      STATE: /state/status.db
      HOST_PROC: /host/proc
      DISK_PATH: /data
    volumes:
      - /proc:/host/proc:ro
      - /opt/mesa/data:/data:ro
      - /opt/mesa/data/status:/state

  # Market data for chains Mesa does not index (HyperEVM), from Codex.
  market:
    build: ../market
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      CODEX_API_KEY: ${CODEX_API_KEY}
      PORT: "8085"
      MEDIA_DIR: /media
    volumes:
      # Images uploaded at launch: permanent, addressed by their hash.
      - /opt/mesa/data/media:/media

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_SECRET_PATH: ${NODE_SECRET_PATH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/mesa/data/caddy:/data
      - /opt/mesa/status:/srv/status:ro
