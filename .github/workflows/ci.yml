name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
      - run: forge fmt --check
      # Size limits apply to what we deploy: the default-profile build of src/.
      # Foundry also compiles every contract under the PoolManager's test-only
      # "v4" profile (names ending in .v4); those copies are never deployed.
      - name: forge build, deployable contracts within EIP-170
        run: |
          forge build --sizes --json > sizes.json || true
          python3 - <<'PY'
          import json, pathlib, sys
          sizes = json.load(open("sizes.json"))
          ours = {p.stem for p in pathlib.Path("src").glob("*.sol")}
          over = {n: v["runtime_size"] for n, v in sizes.items() if n in ours and v["runtime_size"] > 24576}
          for n in sorted(ours & sizes.keys()):
              print(f"{n:24} {sizes[n]['runtime_size']:>6} bytes")
          if over:
              sys.exit(f"over EIP-170: {over}")
          PY
      - run: forge test -vv

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci
      - run: npm run typecheck

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci
      - run: npm run typecheck

  indexer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci
      - run: npm run typecheck

  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: status
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci
      - run: npm run typecheck

  market:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci
      - run: npm run typecheck
